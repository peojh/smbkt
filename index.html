<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 북커톤 프로젝트</title>

  <!-- 파비콘 링크 태그 (기본 이모지 SVG fallback) -->
  <link rel="icon" id="favicon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="shortcut icon" id="shortcut-favicon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

  <script>
    (function setCustomFavicon() {
      try {
        // 64x64 캔버스 생성 (고해상도 탭 파비콘 렌더링)
        var canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        var ctx = canvas.getContext('2d');

        if (!ctx) return;

        // 1. 둥근 모서리의 프리미엄 배경 (인디고 블루)
        var r = 14;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(64 - r, 0);
        ctx.quadraticCurveTo(64, 0, 64, r);
        ctx.lineTo(64, 64 - r);
        ctx.quadraticCurveTo(64, 64, 64 - r, 64);
        ctx.lineTo(r, 64);
        ctx.quadraticCurveTo(0, 64, 0, 64 - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();

        var bgGrad = ctx.createLinearGradient(0, 0, 64, 64);
        bgGrad.addColorStop(0, '#4338CA'); // 로열 인디고
        bgGrad.addColorStop(1, '#1E1B4B'); // 딥 나이트
        ctx.fillStyle = bgGrad;
        ctx.fill();

        // 2. 펼쳐진 책 그래픽 드로잉
        ctx.fillStyle = '#FFFFFF';
        // 왼쪽 페이지
        ctx.beginPath();
        ctx.moveTo(32, 28);
        ctx.quadraticCurveTo(20, 24, 10, 27);
        ctx.lineTo(10, 48);
        ctx.quadraticCurveTo(20, 45, 32, 50);
        ctx.closePath();
        ctx.fill();

        // 오른쪽 페이지
        ctx.fillStyle = '#E2E8F0';
        ctx.beginPath();
        ctx.moveTo(32, 28);
        ctx.quadraticCurveTo(44, 24, 54, 27);
        ctx.lineTo(54, 48);
        ctx.quadraticCurveTo(44, 45, 32, 50);
        ctx.closePath();
        ctx.fill();

        // 책 등 (가운데 축)
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(32, 28);
        ctx.lineTo(32, 50);
        ctx.stroke();

        // 3. 북커톤 영감/아이디어 스파크 (황금빛 별빛)
        ctx.fillStyle = '#FBBF24';
        ctx.beginPath();
        var cx = 32, cy = 15;
        ctx.moveTo(cx, cy - 8);
        ctx.lineTo(cx + 2.5, cy - 2.5);
        ctx.lineTo(cx + 8, cy);
        ctx.lineTo(cx + 2.5, cy + 2.5);
        ctx.lineTo(cx, cy + 8);
        ctx.lineTo(cx - 2.5, cy + 2.5);
        ctx.lineTo(cx - 8, cy);
        ctx.lineTo(cx - 2.5, cy - 2.5);
        ctx.closePath();
        ctx.fill();

        // 작은 반짝임 점 2개
        ctx.beginPath();
        ctx.arc(46, 12, 1.8, 0, Math.PI * 2);
        ctx.arc(18, 14, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#38BDF8';
        ctx.fill();

        // 4. PNG DataURL 추출 후 파비콘 태그에 즉시 주입 (캐시 강제 갱신)
        var pngData = canvas.toDataURL('image/png');
        var link = document.getElementById('favicon') || document.createElement('link');
        link.type = 'image/png';
        link.rel = 'icon';
        link.href = pngData;
        document.getElementsByTagName('head')[0].appendChild(link);

        var shortcutLink = document.getElementById('shortcut-favicon') || document.createElement('link');
        shortcutLink.type = 'image/png';
        shortcutLink.rel = 'shortcut icon';
        shortcutLink.href = pngData;
        document.getElementsByTagName('head')[0].appendChild(shortcutLink);
      } catch (e) {
        console.warn('Favicon generation error:', e);
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <!-- 구글 앱스 스크립트 웹앱 임베드 영역 -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxNSpaYo8Si_N-Ga6OO6xqEMYD4uiNPkx0tFuM12Wg1fWj-MPtByxDtYDRZ7zKbZ25DWA/exec" 
    allowfullscreen
    loading="eager">
  </iframe>
</body>
</html>
